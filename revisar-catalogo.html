<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisar el catálogo — MINSA Captura</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 52rem;
         margin: 0 auto; padding: 1.5rem; line-height: 1.5; }
  h1 { font-size: 1.35rem; margin-bottom: .25rem; }
  .sub { opacity: .7; margin-top: 0; font-size: .95rem; }
  button { font-size: 1rem; padding: .6rem 1.1rem; border-radius: .4rem; cursor: pointer;
           border: 1px solid currentColor; background: transparent; color: inherit; }
  button:disabled { opacity: .45; cursor: default; }
  table { border-collapse: collapse; width: 100%; margin: .6rem 0 1.2rem; font-size: .86rem; }
  th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid rgba(128,128,128,.3); }
  th { font-weight: 600; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; }
  .mal { color: #b3261e; font-weight: 600; }
  .ok { color: #17803d; font-weight: 600; }
  .aviso { padding: .8rem 1rem; border-radius: .4rem; border: 1px solid rgba(128,128,128,.4);
           margin: 1rem 0; }
  #estado { margin: 1rem 0; font-size: .95rem; }
</style>
</head>
<body>

<h1>Esquema real de <code>CAT_Evidencia_MINSA</code></h1>
<p class="sub">Busca la lista en los sitios que la app alcanza y reporta los <strong>nombres
internos</strong> de sus columnas — que son los que Graph usa y no siempre coinciden con lo que
se ve en pantalla. <strong>Sólo lee.</strong></p>

<button id="btn">Iniciar sesión y revisar</button>
<div id="estado"></div>
<div id="salida"></div>
<p class="sub" id="pie"></p>

<script src="./vendor/msal-browser.min.js"></script>
<script type="module">
import { CONFIG } from './config.js';

const $btn = document.getElementById('btn');
const $estado = document.getElementById('estado');
const $salida = document.getElementById('salida');

// Se sube cuando cambia lo que la herramienta busca, para poder distinguir un resultado
// de la version nueva de uno que quedo de la anterior.
const VERSION = 2;

const NOMBRE_LISTA = CONFIG.catalogo.lista;

// Primero donde sabemos que esta (rama Administracion), y si no, los 5 sitios de la app
// y la raiz del tenant.
const CANDIDATOS = [
    { nombre: 'Administración (rama)', ruta: CONFIG.catalogo.ruta },
    ...CONFIG.unidades.map(u => ({ nombre: u.nombre, ruta: u.ruta })),
    { nombre: '(raíz del tenant)', ruta: '' }
];

const pca = new msal.PublicClientApplication({
  auth: {
    clientId: CONFIG.clientId,
    authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`,
    redirectUri: window.location.origin + '/'
  },
  cache: { cacheLocation: 'sessionStorage', storeAuthStateInCookie: false }
});

async function token() {
  const cuentas = pca.getAllAccounts();
  try {
    const r = await pca.acquireTokenSilent({ scopes: CONFIG.scopes, account: cuentas[0] });
    return r.accessToken;
  } catch (e) {
    return (await pca.acquireTokenPopup({ scopes: CONFIG.scopes })).accessToken;
  }
}

async function graph(url, tok) {
  const r = await fetch(url, { headers: { Authorization: 'Bearer ' + tok } });
  return { ok: r.ok, status: r.status, json: r.ok ? await r.json() : null };
}

function tabla(cabeceras, renglones, contenedor) {
  const t = document.createElement('table');
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  for (const c of cabeceras) {
    const th = document.createElement('th'); th.textContent = c; trh.appendChild(th);
  }
  thead.appendChild(trh); t.appendChild(thead);
  const tb = document.createElement('tbody');
  for (const fila of renglones) {
    const tr = document.createElement('tr');
    for (const celda of fila) {
      const td = document.createElement('td');
      td.textContent = celda === null || celda === undefined ? '' : String(celda);
      tr.appendChild(td);
    }
    tb.appendChild(tr);
  }
  t.appendChild(tb); contenedor.appendChild(t);
}

function titulo(texto, nivel = 'h2') {
  const h = document.createElement(nivel);
  h.textContent = texto;
  h.style.fontSize = nivel === 'h2' ? '1.05rem' : '.95rem';
  h.style.margin = '1.2rem 0 .2rem';
  $salida.appendChild(h);
}

function aviso(texto, clase) {
  const d = document.createElement('div');
  d.className = 'aviso' + (clase ? ' ' + clase : '');
  d.textContent = texto;
  $salida.appendChild(d);
  return d;
}

// Se ve en pantalla para confirmar de un vistazo que el navegador cargo la version nueva
// y no una guardada en cache.
document.getElementById('pie').textContent =
  `herramienta v${VERSION} · busca en: ` + CANDIDATOS.map(c => c.nombre).join(' · ');

$btn.addEventListener('click', async () => {
  $btn.disabled = true;
  $salida.textContent = '';
  // La marca de tiempo evita confundir un resultado viejo con uno recien hecho: sin ella,
  // un archivo de hace dos minutos se lee igual que el de ahora.
  const informe = { generado: new Date().toISOString(), version: VERSION, buscadaEn: [], encontrada: null };

  try {
    await pca.initialize();
    if (pca.getAllAccounts().length === 0) await pca.loginPopup({ scopes: CONFIG.scopes });
    const cuenta = pca.getAllAccounts()[0];
    $estado.textContent = `Sesión: ${cuenta.username}`;
    const tok = await token();

    let hallada = null;

    for (const cand of CANDIDATOS) {
      const url = cand.ruta
        ? `${CONFIG.graph}/sites/${CONFIG.sharepointHost}:${cand.ruta}`
        : `${CONFIG.graph}/sites/${CONFIG.sharepointHost}`;
      const sitio = await graph(url, tok);
      if (!sitio.ok) {
        informe.buscadaEn.push({ sitio: cand.nombre, resultado: `sin acceso (${sitio.status})` });
        continue;
      }
      const listas = await graph(
        `${CONFIG.graph}/sites/${sitio.json.id}/lists?$select=id,name,displayName&$top=200`, tok);
      if (!listas.ok) {
        informe.buscadaEn.push({ sitio: cand.nombre, resultado: `no se pudieron listar (${listas.status})` });
        continue;
      }
      const l = listas.json.value.find(
        x => x.displayName === NOMBRE_LISTA || x.name === NOMBRE_LISTA);
      if (l) {
        hallada = { cand, siteId: sitio.json.id, lista: l };
        informe.buscadaEn.push({ sitio: cand.nombre, resultado: 'ENCONTRADA' });
        break;
      }
      informe.buscadaEn.push({ sitio: cand.nombre, resultado: 'no está aquí' });
    }

    titulo('Dónde se buscó');
    tabla(['Sitio', 'Resultado'], informe.buscadaEn.map(x => [x.sitio, x.resultado]), $salida);

    if (!hallada) {
      aviso(`No se encontró ${NOMBRE_LISTA} en ningún sitio que la app alcance. ` +
            `Si la creaste en otro sitio, hay que otorgarle permiso a la app sobre ESE sitio ` +
            `también — con Sites.Selected no alcanza nada que no se le haya autorizado.`, 'mal');
      await guardar(informe);
      return;
    }

    aviso(`Encontrada en ${hallada.cand.nombre} · sitio ${hallada.cand.ruta || '(raíz)'}`, 'ok');
    informe.encontrada = {
      sitio: hallada.cand.nombre,
      ruta: hallada.cand.ruta,
      siteId: hallada.siteId,
      listId: hallada.lista.id,
      nombreInterno: hallada.lista.name,
      nombreMostrado: hallada.lista.displayName
    };

    // --- Las columnas: nombre INTERNO vs nombre para mostrar
    const cols = await graph(
      `${CONFIG.graph}/sites/${hallada.siteId}/lists/${hallada.lista.id}/columns` +
      `?$select=name,displayName,columnGroup,readOnly,hidden`, tok);

    if (cols.ok) {
      const propias = cols.json.value.filter(c => !c.hidden && c.columnGroup !== '_Hidden');
      informe.encontrada.columnas = propias.map(c => ({
        interno: c.name, mostrado: c.displayName, soloLectura: !!c.readOnly
      }));
      titulo('Columnas — el nombre INTERNO es el que usa el código');
      tabla(['Nombre interno (Graph)', 'Nombre para mostrar', 'Sólo lectura'],
        propias.map(c => [c.name, c.displayName, c.readOnly ? 'sí' : '']), $salida);

      const distintas = propias.filter(c => c.name !== c.displayName && !c.readOnly);
      if (distintas.length) {
        aviso('OJO: en estas columnas el nombre interno NO coincide con el que se ve: ' +
              distintas.map(c => `"${c.displayName}" → ${c.name}`).join(' · ') +
              '. El código tiene que usar el interno.');
      }
    } else {
      aviso(`No se pudieron leer las columnas (HTTP ${cols.status}).`, 'mal');
    }

    // --- Los renglones
    const items = await graph(
      `${CONFIG.graph}/sites/${hallada.siteId}/lists/${hallada.lista.id}/items?expand=fields&$top=100`, tok);
    if (items.ok) {
      const filas = items.json.value.map(x => x.fields);
      informe.encontrada.renglones = filas;
      titulo(`Renglones capturados (${filas.length})`);
      if (filas.length === 0) {
        aviso('La lista está vacía todavía. Eso está bien si apenas la creaste: ' +
              'lo que importa ahora son los nombres internos de las columnas.');
      } else {
        const claves = [...new Set(filas.flatMap(f => Object.keys(f)))]
          .filter(k => !k.startsWith('@') && !['id', 'ContentType', 'Modified', 'Created',
            'AuthorLookupId', 'EditorLookupId', '_UIVersionString', 'Attachments',
            'Edit', 'LinkTitleNoMenu', 'LinkTitle', 'ItemChildCount', 'FolderChildCount',
            '_ComplianceFlags', '_ComplianceTag', '_ComplianceTagWrittenTime',
            '_ComplianceTagUserId', 'AppAuthorLookupId', 'AppEditorLookupId'].includes(k));
        tabla(claves, filas.map(f => claves.map(k => f[k])), $salida);
      }
    } else {
      aviso(`No se pudieron leer los renglones (HTTP ${items.status}).`, 'mal');
    }

    await guardar(informe);
  } catch (e) {
    aviso('Error: ' + (e && e.message ? e.message : String(e)), 'mal');
  } finally {
    $btn.disabled = false;
  }
});

async function guardar(informe) {
  try {
    const r = await fetch('/guardar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(informe, null, 2)
    });
    aviso(r.ok
      ? 'Resultado guardado en app/_salida-dev.json — avísale a Claude.'
      : 'No se pudo guardar el archivo; copia lo de arriba.');
  } catch (_) {
    aviso('No se pudo guardar el archivo; copia lo de arriba.');
  }
}
</script>
</body>
</html>

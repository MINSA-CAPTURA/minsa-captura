<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorar bibliotecas — MINSA Captura</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 46rem;
         margin: 0 auto; padding: 1.5rem; line-height: 1.5; }
  h1 { font-size: 1.35rem; margin-bottom: .25rem; }
  .sub { opacity: .7; margin-top: 0; font-size: .95rem; }
  button { font-size: 1rem; padding: .6rem 1.1rem; border-radius: .4rem; cursor: pointer;
           border: 1px solid currentColor; background: transparent; color: inherit; }
  button:disabled { opacity: .45; cursor: default; }
  h2 { font-size: 1rem; margin: 1.4rem 0 .3rem; }
  ul { margin: .2rem 0 0; padding-left: 1.2rem; font-family: ui-monospace, Consolas, monospace;
       font-size: .85rem; }
  #estado { margin: 1rem 0; font-size: .95rem; }
  #listo { margin-top: 1.25rem; padding: .8rem 1rem; border-radius: .4rem;
           border: 1px solid rgba(128,128,128,.4); display: none; }
</style>
</head>
<body>

<h1>Estructura real de las 5 bibliotecas</h1>
<p class="sub">Lista las carpetas de primer nivel de cada unidad para poder escribir el catálogo
sin adivinar rutas. <strong>Sólo lee.</strong> Al terminar deja el resultado en un archivo local.</p>

<button id="btn">Iniciar sesión y explorar</button>
<div id="estado"></div>
<div id="salida"></div>
<div id="listo"></div>

<script src="./vendor/msal-browser.min.js"></script>
<script type="module">
import { CONFIG } from './config.js';

const $btn = document.getElementById('btn');
const $estado = document.getElementById('estado');
const $salida = document.getElementById('salida');
const $listo = document.getElementById('listo');

// Sello de origen. Esta herramienta y revisar-catalogo.html escriben el MISMO
// archivo (_salida-dev.json), y dos corridas producen resultados que se ven
// identicos, asi que sin sello no hay como saber ni de cual herramienta ni de
// cual version viene lo que se esta leyendo. Se sube VERSION cuando cambia lo
// que la herramienta hace.
const HERRAMIENTA = 'explorar';
const VERSION = 1;
$listo.insertAdjacentHTML('beforebegin',
  `<p style="opacity:.6;font-size:.85em">herramienta ${HERRAMIENTA} v${VERSION}</p>`);

// NO llamar a esta variable `msal`: taparia el global del bundle UMD.
const pca = new msal.PublicClientApplication({
  auth: {
    clientId: CONFIG.clientId,
    authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`,
    redirectUri: window.location.origin + '/'
  },
  cache: { cacheLocation: 'sessionStorage', storeAuthStateInCookie: false }
});

async function token() {
  const cuentas = pca.getAllAccounts();
  try {
    const r = await pca.acquireTokenSilent({ scopes: CONFIG.scopes, account: cuentas[0] });
    return r.accessToken;
  } catch (e) {
    const r = await pca.acquireTokenPopup({ scopes: CONFIG.scopes });
    return r.accessToken;
  }
}

async function graph(url, tok) {
  const r = await fetch(url, { headers: { Authorization: 'Bearer ' + tok } });
  return { ok: r.ok, status: r.status, json: r.ok ? await r.json() : null };
}

$btn.addEventListener('click', async () => {
  $btn.disabled = true;
  $salida.textContent = '';
  $listo.style.display = 'none';
  const resultado = {};

  try {
    await pca.initialize();
    if (pca.getAllAccounts().length === 0) {
      await pca.loginPopup({ scopes: CONFIG.scopes });
    }
    const cuenta = pca.getAllAccounts()[0];
    $estado.textContent = `Sesión: ${cuenta.username}`;
    const tok = await token();

    for (const u of CONFIG.unidades) {
      const h2 = document.createElement('h2');
      h2.textContent = u.nombre;
      $salida.appendChild(h2);
      const ul = document.createElement('ul');
      $salida.appendChild(ul);

      const sitio = await graph(`${CONFIG.graph}/sites/${CONFIG.sharepointHost}:${u.ruta}`, tok);
      if (!sitio.ok) {
        const li = document.createElement('li');
        li.textContent = `(sin acceso: HTTP ${sitio.status})`;
        ul.appendChild(li);
        resultado[u.clave] = { error: sitio.status };
        continue;
      }

      const hijos = await graph(
        `${CONFIG.graph}/sites/${sitio.json.id}/drive/root/children?$select=name,folder&$top=200`, tok);
      if (!hijos.ok) {
        const li = document.createElement('li');
        li.textContent = `(no se pudo listar: HTTP ${hijos.status})`;
        ul.appendChild(li);
        resultado[u.clave] = { error: hijos.status };
        continue;
      }

      const carpetas = hijos.json.value
        .filter(x => x.folder)
        .map(x => x.name)
        .sort((a, b) => a.localeCompare(b, 'es'));

      resultado[u.clave] = { sitio: u.ruta, carpetas };
      for (const nombre of carpetas) {
        const li = document.createElement('li');
        li.textContent = nombre;   // textContent, nunca innerHTML
        ul.appendChild(li);
      }
    }

    // Dejarlo en un archivo local para no copiar y pegar a mano.
    let guardado = false;
    try {
      const informe = {
        herramienta: HERRAMIENTA,
        version: VERSION,
        generado: new Date().toISOString(),
        unidades: resultado
      };
      const r = await fetch('/guardar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(informe, null, 2)
      });
      guardado = r.ok;
    } catch (_) {}

    $listo.style.display = 'block';
    // El aviso incluye el sello para que lo que le digas a Claude identifique
    // la corrida: un "listo" a secas no distingue esta de una de hace dos dias.
    const sello = `${HERRAMIENTA} v${VERSION}, ${new Date().toLocaleTimeString('es-MX')}`;
    $listo.textContent = guardado
      ? `Listo (${sello}). El resultado quedó guardado en app/_salida-dev.json — dile a Claude "corrí ${sello}".`
      : `Listo (${sello}), pero no se pudo guardar el archivo. Copia lo de arriba y pégaselo a Claude.`;
  } catch (e) {
    $listo.style.display = 'block';
    $listo.textContent = 'Error: ' + (e && e.message ? e.message : String(e));
  } finally {
    $btn.disabled = false;
  }
});
</script>
</body>
</html>
